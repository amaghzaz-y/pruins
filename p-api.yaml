              type: string
            guidance_scale:
              title: Guidance Scale
              default: 0
              maximum: 20
              minimum: 0
              description: Guidance scale. Should be 0 for Turbo models
              type: number
            output_quality:
              title: Output Quality
              default: 80
              maximum: 100
              minimum: 0
              description: >-
                Quality when saving the output images, from 0 to 100. 100 is
                best quality, 0 is lowest quality. Not relevant for .png outputs
              type: integer
            num_inference_steps:
              title: Num Inference Steps
              default: 8
              maximum: 50
              minimum: 1
              description: >-
                Number of inference steps. This actually results in
                (num_inference_steps - 1) DiT forwards
              type: integer
          required:
            - prompt
          additionalProperties: false
      description: >-
        AI model based on z-image compatible with custom loras for content
        generation. Rate limit: 150 requests per minute.
    p-video:
      type: object
      required:
        - input
      properties:
        input:
          type: object
          properties:
            fps:
              enum:
                - 24
                - 48
              title: fps
              description: Frames per second of the video.
              default: 24
              type: integer
            seed:
              title: Seed
              description: Random seed. Set for reproducible generation.
              type: integer
            audio:
              title: Audio
              format: uri
              description: >-
                Input audio to condition video generation. Supports flac, mp3,
                wav.
              type: string
            draft:
              title: Draft
              default: false
              description: >-
                Draft mode. Generates a lower-quality preview of the video, but
                if you fix the seed it will be the exact same video as the
                non-draft mode, just with a faster generation. Use this to
                experiment.
              type: boolean
            image:
              title: Image
              format: uri
              description: >-
                Input image to generate video from (image-to-video). Supports
                jpg, jpeg, png, webp.
              type: string
            prompt:
              title: Prompt
              description: Text prompt for video generation.
              type: string
            duration:
              title: Duration
              default: 5
              maximum: 10
              minimum: 1
              description: >-
                Duration of the video in seconds (1-10). Ignored when audio is
                provided.
              type: integer
            resolution:
              enum:
                - 720p
                - 1080p
              title: resolution
              description: Resolution of the video.
              default: 720p
              type: string
            save_audio:
              title: Save Audio
              default: true
              description: Save the video with audio.
              type: boolean
            aspect_ratio:
              enum:
                - '16:9'
                - '9:16'
                - '4:3'
                - '3:4'
                - '3:2'
                - '2:3'
                - '1:1'
              title: aspect_ratio
              description: >-
                Aspect ratio of the video. Ignored when an input image is
                provided.
              default: '16:9'
              type: string
            prompt_upsampling:
              title: Prompt Upsampling
              default: true
              description: Use prompt upsampling to enhance the prompt.
              type: boolean
            disable_safety_filter:
              title: Disable Safety Filter
              default: true
              description: >-
                Disable safety filter for prompts (and input image). When
                disabled, prompts are not checked for unsafe content before
                generation.
              type: boolean
          required:
            - prompt
          additionalProperties: false
      description: 'AI model for content generation. Rate limit: 250 requests per minute.'
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request parameters
              details: Field 'model' is required
            request_id: req_1234567890
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: AUTHENTICATION_FAILED
              message: Invalid or missing API key
              details: Include your API key in the 'apikey' header
            request_id: req_1234567890
    ValidationError:
      description: Request validation failed - invalid input parameters
      content:
        application/json:
          schema:
            type: object
            required:
              - detail
              - status
              - title
            properties:
              detail:
                type: string
                description: Human-readable error summary
                example: >
                  - input.num_inference_steps: Invalid type. Expected: integer,
                  given: string
              status:
                type: integer
                description: HTTP status code
                example: 422
              title:
                type: string
                description: Error title
                example: Input validation failed
              invalid_fields:
                type: array
                description: List of field-specific validation errors
                items:
                  type: object
                  required:
                    - type
                    - field
                    - description
                  properties:
                    type:
                      type: string
                      description: Type of validation error
                      example: invalid_type
                    field:
                      type: string
                      description: Field path that failed validation
                      example: input.num_inference_steps
                    description:
                      type: string
                      description: Error description
                      example: 'Invalid type. Expected: integer, given: string'
          examples:
            type_error:
              summary: Invalid parameter type
              value:
                detail: >
                  - input.num_inference_steps: Invalid type. Expected: integer,
                  given: string
                status: 422
                title: Input validation failed
                invalid_fields:
                  - type: invalid_type
                    field: input.num_inference_steps
                    description: 'Invalid type. Expected: integer, given: string'
            missing_field:
              summary: Required field missing
              value:
                detail: |
                  - input.prompt: Field required
                status: 422
                title: Input validation failed
                invalid_fields:
                  - type: missing
                    field: input.prompt
                    description: Field required
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
              details: >-
                Please try again later or contact support if the problem
                persists
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: The requested resource was not found
              details: Prediction ID does not exist or has expired
            request_id: req_1234567890
    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests
              details: >-
                You have exceeded the rate limit for this endpoint. Please wait
                before making additional requests.
            request_id: req_1234567890
      headers:
        RateLimit-Limit:
          description: Allowed limit in the timeframe
          schema:
            type: string
          example: '10000'
        RateLimit-Remaining:
          description: Number of available requests remaining
          schema:
            type: string
          example: '0'
        RateLimit-Reset:
          description: 'The time remaining, in seconds, until the rate limit quota is reset'
          schema:
            type: string
          example: '42'
